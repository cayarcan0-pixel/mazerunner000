name: win 11 RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User (Robust)
        run: |
          $user = "RDP"
          $password = "TechZoner@001"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          # Kullanıcı zaten varsa şifresini sıfırla, yoksa oluştur
          $existing = Get-LocalUser -Name $user -ErrorAction SilentlyContinue
          if ($existing) {
              Set-LocalUser -Name $user -Password $securePass -PasswordNeverExpires $true
              Write-Host "Existing user password reset."
          } else {
              try {
                  New-LocalUser -Name $user -Password $securePass -AccountNeverExpires -PasswordNeverExpires -ErrorAction Stop
                  Write-Host "User created."
              } catch {
                  Write-Host "New-LocalUser failed: $($_.Exception.Message)"
                  # Yarım kalan kullanıcıyı temizle
                  Remove-LocalUser -Name $user -ErrorAction SilentlyContinue
                  # net user ile tekrar dene (bazı runner'larda daha güvenilir)
                  net user $user $password /add /expires:never
                  net user $user $password
                  Write-Host "User created via net user fallback."
              }
          }

          # Gruplara ekle (string olarak, obje değil)
          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue

          # Doğrulama
          if (-not (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) {
              Write-Error "User creation completely failed!"
              exit 1
          }
          echo "RDP_CREDS=User: $user | Password: $password" >> $env:GITHUB_ENV
          Write-Host "RDP user ready."

      - name: Install Latest Tailscale (Silent + Unattended)
        run: |
          $page = Invoke-WebRequest -Uri "https://tailscale.com/download/windows" -UseBasicParsing
          $match = [regex]::Match($page.Content, 'https://pkgs\.tailscale\.com/stable/tailscale-setup-[\d\.]+-amd64\.msi')
          if (-not $match.Success) { Write-Error "Tailscale MSI URL not found"; exit 1 }
          $tsUrl = $match.Value
          Write-Host "Installing: $tsUrl"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          # MSI parametreleri: sessiz kurulum + oturum açılmadan çalışma modu
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/qn", "TS_NOLAUNCH=true", "TS_UNATTENDEDMODE=always" -Wait
          Remove-Item $installerPath -Force
          Write-Host "Tailscale installed."

      - name: Connect Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTHKEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID `
            --accept-routes `
            --accept-dns=false
          Start-Sleep -Seconds 8
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          if (-not $tsIP) { Write-Error "Tailscale IP not assigned."; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $tsIP"

      - name: Verify RDP Accessibility
        run: |
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "RDP port 3389 unreachable on Tailscale IP."
              exit 1
          }
          Write-Host "RDP port is reachable."

      - name: Setup Startup Script (No Login Wait)
        run: |
          $startupPath = "C:\Users\RDP\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com/TechZoner@001/pcme_rdp/-/raw/main/Downloads.bat"
          $downloadPath = "$startupPath\Downloads.bat"
          New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
          try {
              Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing
              Write-Host "Downloads.bat placed."
              cmd /c $downloadPath
              Write-Host "Downloads.bat executed."
          } catch {
              Write-Host "Warning: Downloads.bat step skipped: $($_.Exception.Message)"
          }

      - name: Display Info + Keep Alive
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: TechZoner@001"
          Write-Host "==================`n"
          while ($true) {
              Write-Host "[$(Get-Date)] RDP active..."
              Start-Sleep -Seconds 300
          }
